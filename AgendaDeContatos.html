<!doctype html>
<html lang="pt-BR">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda de contatos</title>
    <link rel="stylesheet" href="css/fundo.css" />
    <link rel="stylesheet" href="css/Style.css" />

    <!-- css interno -->
    <style>
      h1 {
        margin: 0%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .Botoes {
        margin-top: 5px;
        align-items: center;
        flex-wrap: wrap;
        display: flex;
        flex-direction: row;
        gap: 20px;
        padding: 20px;
      }

      .button {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 25px;
      }

      .Botoes a {
        text-decoration: none;
      }

      .Botoes button {
        background: #2f6688;
        color: #ffffff;
        border: 2px solid #2f6688;
        padding: 11px 20px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .table {
        width: 100%;
        flex-wrap: wrap;
        border-collapse: collapse;
        margin-top: 10px;
      }

      /* Cabeçalho da tabela */

      .table thead th {
        background: #2f6688 !important;
        color: #ffffff !important;
        padding: 14px;
        font-size: 14px;
        font-weight: bold;
        text-align: center;
        border: none;
      }

      /* Conteúdo da tabela */

      .table tbody td {
        padding: 13px 14px;
        color: #334155;
        font-size: 14px;
        vertical-align: middle;
        text-align: center;
      }

      /* Linhas da tabela */

      .table tbody tr {
        transition: all 0.2s ease;
      }

      /* Efeito ao passar o mouse */

      .table tbody tr:hover {
        background-color: #e5f0f5 !important;
      }

      /* Coluna Ações */

      .table th:last-child,
      .table td:last-child {
        text-align: center;
      }
    </style>
  </head>

  <body>
    <!--  tag header é o cabeçalho do site -->
    <header>
      <!--Estilização inline-->
      <h1
        style="
          font-family:
            Segoe UI,
            Arial,
            sans-serif;
          font-size: 36px;
          color: #2c3e50;
          text-align: center;
          font-weight: 700;
          letter-spacing: -0.5px;
          text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.1);
        "
      >
        Agenda de Contatos
      </h1>
    </header>

    <div class="Botoes">
      <!-- Java Script inline -->
      <button type="button" onclick="window.location.href = 'Cadastro.html'">
        Novo Contato
      </button>

      <a href="Pesquisar.html">
        <button type="button">Pesquisar</button>
      </a>

      <a href="Ordenacao.html">
        <button type="button">Ordenação</button>
      </a>
    </div>

    <main class="tabela">
      <!--  -->
      <table class="table table-striped table-hover table-bordered">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Empresa</th>
            <th>Telefone</th>
            <th>Observações</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaContatosCorpo">
          <!-- Linhas inseridas dinamicamente pelo JavaScript -->
        </tbody>
      </table>
    </main>

    <!-- Rodapé -->
    <footer style="flex-wrap: wrap">Manaus-AM</footer>

    <script src="js/agenda.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
