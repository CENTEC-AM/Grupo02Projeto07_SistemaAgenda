<!doctype html>
<html lang="pt=BR">
    <head>
        <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/fundo.css">
    <link rel="stylesheet" href="css/Style.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      />
    <title>Contato</title>
  </head>
  <body>
    <div class="botoes">
      <button type="button">Excluir</button>
      <button type="button">Editar</button>
    </div>

    <div class="imagemPerfil">
      <img src="img/FotoPerfil7.jpg" width="200" height="200" />
      </div>

      <main id="main-container">
        <section id="contatar-container">

        <div class="card_container">
            <a href="" target="_blank" class="contato-card Telefone"> </a>
            <div class="card-icone">
                <i class="fa-solid fa-phone"></i>
                <p>Ligar</p>
            </div>
        </div>
        
        <div class="card_container">
      <a href="" target="_blank" class="contato-card VideoChamada"> </a>
      <div class="card-icone">
        <i class="fa-solid fa-video"></i>
        <p>Video Chamada</p>
      </div>
    </div>

    <div class="card_container">
      <a href="" target="_blank" class="contato-card EnviarMensagem"> </a>
      <div class="card-icone">
        <i class="fa-solid fa-comment"></i>
        <p>Mensagem</p>
      </div>
    </div>

    <div class="card_container">
      <a href="" target="_blank" class="contato-card Email"> </a>
      <div class="card-icone">
        <i class="fa-solid fa-square-envelope"></i>
        <p>E-mail</p>
      </div>
    </div>

    <div class="card_container">
      <a href="" target="_blank" class="contato-card Whatsapp"> </a>
      <div class="card-icone">
          <i class="fa-brands fa-whatsapp"></i>
          <p>Whatsapp</p>
        </div>
    </div>

    </section>  
</main>


    <script src="js/agenda.js"></script>
  </body>
  </html>
