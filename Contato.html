<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/fundo.css" />
    <link rel="stylesheet" href="css/Style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Contato</title>
  </head>
  <body>
    <div class="botoes">
      <button type="button" onclick="excluirContato()">Excluir</button>
      <a href="#" id="linkEditar"><button type="button">Editar</button></a>
    </div>

    <div class="imagemPerfil">
      <img src="img/FotoPerfil7.jpg" width="200" height="200" />
    </div>
    <h2 id="nomeContato" style="text-align: center; margin-bottom: 20px"></h2>

    <main id="main-container">
      <section id="contatar-container">
        <div class="card_container">
          <a href="" target="_blank" class="contato-card Telefone"> </a>
          <div class="card-icone">
            <i class="fa-solid fa-phone"></i>
            <p id="cardTelefone">Telefone</p>
          </div>
        </div>

        <div class="card_container">
          <a href="" target="_blank" class="contato-card VideoChamada"> </a>
          <div class="card-icone">
            <i class="fa-solid fa-video"></i>
            <p>Video Chamada</p>
          </div>
        </div>

        <div class="card_container">
          <a href="" target="_blank" class="contato-card EnviarMensagem"> </a>
          <div class="card-icone">
            <i class="fa-solid fa-comment"></i>
            <p>Mensagem</p>
          </div>
        </div>

        <div class="card_container">
          <a href="" target="_blank" class="contato-card Email"> </a>
          <div class="card-icone">
            <i class="fa-solid fa-square-envelope"></i>
            <p>E-mail</p>
          </div>
        </div>

        <div class="card_container">
          <a href="" target="_blank" class="contato-card Whatsapp"> </a>
          <div class="card-icone">
            <i class="fa-brands fa-whatsapp"></i>
            <p>Whatsapp</p>
          </div>
        </div>
      </section>

      <!-- Área de detalhes adicionada -->
      <div style="text-align: center; margin-top: 20px">
        <p><strong>Telefone:</strong> <span id="cardTelefone"></span></p>
        <p><strong>Empresa:</strong> <span id="cardEmpresa"></span></p>
        <p>
          <strong>Observações:</strong> <span id="observacoesContato"></span>
        </p>
      </div>
    </main>

    <script src="js/agenda.js"></script>
    <!-- Bootstrap 5 JS (opcional, mas necessário para componentes interativos) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      // Variável global para guardar o contato atual
      let contatoAtual = null;

      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const id = Number(params.get("id"));

        if (id) {
          contatoAtual = obterContatoPorId(id);

          if (contatoAtual) {
            // Mostra o nome na página e no título da aba
            document.title = `${contatoAtual.nome} ${contatoAtual.sobrenome}`;
            document.querySelector("#nomeContato").textContent =
              `${contatoAtual.nome} ${contatoAtual.sobrenome}`;

            // Define o link de editar corretamente com o ID real
            document.querySelector("#linkEditar").href =
              `Atualizar.html?id=${contatoAtual.id}`;

            // Preenche o telefone (span na área de detalhes)
            const telElement = document.querySelector("#cardTelefone");
            if (telElement) telElement.textContent = contatoAtual.telefone;

            // Preenche a empresa (span na área de detalhes)
            const empElement = document.querySelector("#cardEmpresa");
            if (empElement)
              empElement.textContent = contatoAtual.empresa || "Não informado";

            // Preenche as observações (span na área de detalhes)
            const obsElement = document.querySelector("#observacoesContato");
            if (obsElement)
              obsElement.textContent =
                contatoAtual.observacoes || "Sem observações";
          } else {
            alert("Contato não encontrado!");
            window.location.href = "AgendaDeContatos.html";
          }
        }
      });

      // Função para excluir de verdade
      function excluirContato() {
        if (!contatoAtual) return;

        if (confirm("Deseja realmente excluir este contato?")) {
          let contatos = obterContatos();
          contatos = contatos.filter((c) => c.id !== contatoAtual.id);
          salvarContatos(contatos);
          window.location.href = "AgendaDeContatos.html";
        }
      }
    </script>
  </body>
</html>
