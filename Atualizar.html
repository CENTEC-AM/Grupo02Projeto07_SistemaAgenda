<!doctype html>
<html lang="pt-BR">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar</title>
  </head>
  <body>
    <nav><a href="AgendaDeContatos.html">Voltar para a Agenda</a></nav>

    <h1>Atualizar Contato</h1>
    <section>
      <form id="formAtualizar">
        <label for="nome">Nome:</label><br /><input
          type="text"
          id="nome"
          placeholder="Digite o nome"
          required
        /><br /><br />
        <label for="sobrenome">Sobrenome:</label><br />
        <input type="text" id="sobrenome" placeholder="Digite o sobrenome" />
        <br /><br />

        <label for="empresa">Empresa:</label><br />
        <input type="text" id="empresa" placeholder="Nome da empresa" />
        <br /><br />

        <fieldset>
          <legend>Telefone (Celular)</legend>
          <input
            type="tel"
            id="telefone"
            placeholder="(92) 99999-9999"
            required
          />
        </fieldset>
        <br />

        <label for="observacoes">Observações:</label><br />
        <textarea
          id="observacoes"
          name="observacoes"
          rows="4"
          cols="40"
          placeholder="Anotações adicionais..."
        ></textarea>
        <br /><br />

        <button type="submit">Salvar Contato</button>
        <a href="AgendaDeContatos.html"
        
          ><button type="button">Cancelar</button></a
        >
      </form>
    </section>

    <script src="js/agenda.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
